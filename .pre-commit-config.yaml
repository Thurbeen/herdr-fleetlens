repos:
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: ./node_modules/.bin/biome check --no-errors-on-unmatched
        language: system
        types_or: [javascript, json, markdown]
      - id: unit
        name: node --test
        entry: node --test
        language: system
        pass_filenames: false
      - id: herdr-app-check
        name: herdr-app check fleet-lens
        entry: scripts/check-mod.sh
        language: system
        pass_filenames: false
